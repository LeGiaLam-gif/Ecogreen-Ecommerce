spring.application.name=backend

# ── PostgreSQL (default) ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ecogreen?options=-c%20timezone=Asia/Ho_Chi_Minh
spring.datasource.username=postgres
spring.datasource.password=130407
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update keeps Hibernate's model in sync with database/init-postgres.sql
# during development. For a from-scratch database, run init-postgres.sql first.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

server.port=8081

# ── B01-P2: JWT / refresh tokens ──────────────────────────────────────
# JWT_SECRET (>= 32 bytes) is REQUIRED: the application refuses to start without it. No default is provided on purpose.
ecogreen.jwt.secret=${JWT_SECRET:}
ecogreen.jwt.access-ttl-seconds=900
ecogreen.jwt.refresh-ttl-days=14
# Failed-login throttle (per username + client IP)
ecogreen.auth.max-failed-logins=5
ecogreen.auth.lockout-window-seconds=900

# ── B02: catalogue uploads ────────────────────────────────────────────
# Directory for uploaded product images (outside the classpath, git-ignored). Override with UPLOAD_DIR.
ecogreen.upload.dir=${UPLOAD_DIR:./uploads}
# Upload limits (the service re-checks 5 MB itself); an oversized request is answered with 400 by GlobalExceptionHandler.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── B04: shipping fee (decision D-10) ─────────────────────────────────
# Flat fee in VND, free once the items total (before any discount) reaches the threshold (inclusive). Override with the env vars.
ecogreen.shipping.flat-fee=${SHIPPING_FLAT_FEE:30000}
ecogreen.shipping.free-threshold=${FREE_SHIPPING_THRESHOLD:500000}

# ── B06: payment gateway ──────────────────────────────────────────────
# VNPay (API 2.1.0). When tmn-code or secret is empty the VNPAY provider fails closed (400 BUSINESS_RULE_VIOLATION on initiate, the
# webhook is not recorded); the application still starts. Get sandbox values from VNPay; never commit them.
ecogreen.payment.vnpay.tmn-code=${PAYMENT_VNPAY_TMN_CODE:}
ecogreen.payment.vnpay.secret=${PAYMENT_VNPAY_SECRET:}
ecogreen.payment.vnpay.pay-url=${PAYMENT_VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# Frontend page the gateway sends the browser back to. A client-supplied returnUrl is honoured only when it starts with this.
ecogreen.payment.return-url=${PAYMENT_RETURN_URL:http://localhost:5173/payment/return}
# TEMPORARY-COMPAT(B06): local mock provider + dev "mock pay" action. true is the development default; set false outside development.
ecogreen.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}
