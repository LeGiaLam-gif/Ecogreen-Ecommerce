spring.application.name=backend

# ── PostgreSQL (default) ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/ecogreen?options=-c%20timezone=Asia/Ho_Chi_Minh
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=update keeps Hibernate's model in sync with database/init-postgres.sql
# during development. For a from-scratch database, run init-postgres.sql first.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

server.port=8081
