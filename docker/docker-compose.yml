# Run with: docker compose up -d
services:

  postgres:
    image: postgres:16
    container_name: ecogreen-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ecogreen
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
