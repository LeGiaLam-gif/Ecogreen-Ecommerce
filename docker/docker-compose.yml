# Run with: docker compose --env-file ../.env up -d   (from the docker/ folder)
# DB_PASSWORD is required (no default password lives in the repository); DB_PORT defaults to 5432 and must match the
# DB_PORT the backend uses. NOTE: POSTGRES_PASSWORD only applies when the pgdata volume is first created. For an existing
# volume change the password with: ALTER USER postgres WITH PASSWORD '...';
services:

  postgres:
    image: postgres:16
    container_name: ecogreen-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-ecogreen}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
