# Full-stack Docker Compose for EcoGreen E-Commerce
# Usage from repository root:
#   1. Copy .env.example to .env and set DB_PASSWORD + JWT_SECRET (at least 32 chars)
#   2. docker compose up -d --build
#   3. Open http://localhost:5173 (API: http://localhost:8081)

services:
  postgres:
    image: postgres:16
    container_name: ecogreen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-ecogreen}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./database/init-postgres.sql:/docker-entrypoint-initdb.d/sql/init-postgres.sql:ro
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/sql/seed-data.sql:ro
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ecogreen}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecogreen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecogreen}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 bytes) in .env}
      UPLOAD_DIR: /app/uploads
      SHIPPING_FLAT_FEE: ${SHIPPING_FLAT_FEE:-30000}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-500000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      PAYMENT_VNPAY_TMN_CODE: ${PAYMENT_VNPAY_TMN_CODE:-}
      PAYMENT_VNPAY_SECRET: ${PAYMENT_VNPAY_SECRET:-}
      PAYMENT_VNPAY_URL: ${PAYMENT_VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-http://localhost:5173/payment/return}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v21.0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID:-}
    container_name: ecogreen-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  uploads_data:
